<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a0533">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LuckyDraw">
  <title>Sign In | LuckyDraw Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a0533, #0f0520);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .card { background: linear-gradient(135deg, #1e0b3e, #2d1060); }
    /* iOS input zoom fix: font-size must be >= 16px */
    input {
      font-size: 16px !important;
      -webkit-appearance: none;
      border-radius: 12px;
    }
    .input-field {
      background: rgba(124,58,237,0.12);
      border: 1.5px solid rgba(124,58,237,0.35);
      color: white;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
    .input-field::placeholder { color: rgba(255,255,255,0.35); }
    .btn-submit {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      min-height: 54px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-submit:active { transform: scale(0.97); opacity: 0.9; }
  </style>
</head>
<body class="min-h-screen text-white flex items-center justify-center p-5">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="text-6xl mb-3">🎮</div>
      <h1 class="text-2xl font-black text-purple-300">LuckyDraw</h1>
      <p class="inline-flex items-center gap-2 text-xs font-semibold mt-2 px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/30 backdrop-blur-sm shadow-[0_0_10px_rgba(251,191,36,0.5)]">
        🎁 Live Prize Pool
      </p>
    </div>

    <div class="card rounded-2xl p-6 shadow-2xl border border-purple-700/30">
      <h2 class="text-xl font-black mb-6 text-center">Sign In</h2>

      {% if messages %}
      {% for msg in messages %}
      <div class="mb-4 p-3 rounded-xl text-sm bg-red-900/60 border border-red-500/40 text-red-200">
        {{ msg }}
      </div>
      {% endfor %}
      {% endif %}

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-semibold text-purple-300 mb-2">Username</label>
          <input type="text" name="username" required autocomplete="username"
            class="input-field" placeholder="Enter your username">
        </div>
        <div>
          <label class="block text-sm font-semibold text-purple-300 mb-2">Password</label>
          <input type="password" name="password" required autocomplete="current-password"
            class="input-field" placeholder="Enter your password">
        </div>
        <div class="pt-1">
          <button type="submit" class="btn-submit">Sign In</button>
        </div>
      </form>

      <p class="text-center text-sm text-gray-400 mt-5">
        No account yet?
        <a href="/auth/register/" class="text-purple-400 font-bold">Register Free</a>
      </p>
    </div>

    <p class="text-center text-xs text-gray-600 mt-5">
      Join the live draw and win exciting rewards.
    </p>
  </div>
</body>
</html>
